[build]
builder = "RAILPACK"
buildCommand = "npm ci && DATABASE_URL=postgresql://p:p@localhost:5432/p npx prisma generate"

[deploy]
preDeployCommand = "npx prisma migrate deploy && node prisma/seed.js --check && node prisma/seed-hc07.js"
startCommand = "node src/app.js"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
